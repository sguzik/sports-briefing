name: Daily Morning Sports Brief

on:
  schedule:
    # 11:00 UTC = 6:00 AM EST / 7:00 AM EDT
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'morning-sports-brief/requirements.txt'

      - name: Install dependencies
        run: pip install -r morning-sports-brief/requirements.txt

      - name: Build Morning Sports Brief
        working-directory: morning-sports-brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python build_brief.py

      - name: Copy latest.html to index.html for GitHub Pages root
        working-directory: morning-sports-brief
        run: cp dist/latest.html dist/index.html

      - name: Persist updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet morning-sports-brief/data/state.json; then
            git add morning-sports-brief/data/state.json
            git commit -m "chore: update edition state [skip ci]"
            git push
          else
            echo "No changes to morning-sports-brief/data/state.json"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: morning-sports-brief/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
