name: Daily Morning Sports Brief

on:
  schedule:
    # Run around 5:05 AM Eastern year-round (avoids top-of-hour :00 GitHub cron congestion):
    # - 09:05 UTC = 5:05 AM EDT (March–November) / 4:05 AM EST
    # - 10:05 UTC = 5:05 AM EST (November–March) / 6:05 AM EDT
    # The check_schedule step skips the 4 AM EST trigger and prevents duplicate runs on EDT days.
    - cron: '5 9 * * *'
    - cron: '5 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_schedule.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Eastern Time schedule window
        id: check_schedule
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow_dispatch — running build."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ET_HOUR=$(TZ=America/New_York date +%H)
          ET_TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          LAST_DATE=$(python3 -c "import json; print(json.load(open('data/state.json')).get('last_edition_date', ''))" 2>/dev/null || echo "")

          echo "Current ET hour: $ET_HOUR | Today ET: $ET_TODAY | Last edition date: $LAST_DATE"
          if [ "$((10#$ET_HOUR))" -lt 5 ]; then
            echo "Before 5:00 AM Eastern — waiting for the 5 AM ET trigger."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_DATE" = "$ET_TODAY" ]; then
            echo "Edition for $ET_TODAY already published — skipping duplicate trigger."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.check_schedule.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        if: steps.check_schedule.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Build Morning Sports Brief
        if: steps.check_schedule.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python build_brief.py

      - name: Copy latest.html to index.html for GitHub Pages root
        if: steps.check_schedule.outputs.should_run == 'true'
        run: cp dist/latest.html dist/index.html

      - name: Persist updated state.json
        if: steps.check_schedule.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/state.json; then
            git add data/state.json
            git commit -m "chore: update edition state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes to data/state.json"
          fi

      - name: Setup GitHub Pages
        if: steps.check_schedule.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check_schedule.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.should_run == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
